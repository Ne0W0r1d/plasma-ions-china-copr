name: COPR build

on:
  push:
    branches: [main]
  schedule:
    # Daily check for a new upstream tag or a KDE Plasma update.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: copr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  copr:
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 120
    env:
      COPR_PROJECT: ${{ vars.COPR_PROJECT }}
      COPR_API_TOKEN: ${{ secrets.COPR_API_TOKEN }}
    steps:
      - name: Install git and Node.js for actions
        run: dnf -y install git nodejs

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: dnf -y install copr-cli python3 rpm-build rpmdevtools

      - name: Check COPR configuration
        run: |
          set -euo pipefail
          if [[ -z "${COPR_PROJECT:-}" ]]; then
            echo "::error::Set the repository variable COPR_PROJECT (for example owner/plasma-ions-china)."
            exit 1
          fi
          if [[ -z "${COPR_API_TOKEN:-}" ]]; then
            echo "::error::Set the repository secret COPR_API_TOKEN to the contents of ~/.config/copr."
            exit 1
          fi

      - name: Sync spec with upstream and KDE
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ci/update-spec.py --update

      - name: Validate spec
        run: rpmspec -P plasma-ions-china.spec >/dev/null

      - name: Build source RPMs per Plasma version
        if: github.event_name != 'schedule' || steps.sync.outputs.rebuild == 'true'
        id: srpm
        run: |
          mkdir -p "$PWD/out"
          python3 ci/build-matrix.py \
            --state packaging/state.json \
            --chroots copr/chroots.txt \
            --spec plasma-ions-china.spec \
            --outdir "$PWD/out" > "$PWD/out/matrix.tsv"
          cat "$PWD/out/matrix.tsv"
          echo "matrix=$PWD/out/matrix.tsv" >> "$GITHUB_OUTPUT"

      - name: Configure COPR credentials
        if: steps.srpm.outcome == 'success'
        run: |
          set -euo pipefail
          if [[ -z "${COPR_PROJECT:-}" ]]; then
            echo "::error::Set the repository variable COPR_PROJECT (for example owner/plasma-ions-china)."
            exit 1
          fi
          if [[ -z "${COPR_API_TOKEN:-}" ]]; then
            echo "::error::Set the repository secret COPR_API_TOKEN to the contents of ~/.config/copr."
            exit 1
          fi
          install -d -m 700 "$HOME/.config"
          printf '%s\n' "$COPR_API_TOKEN" >"$HOME/.config/copr"
          chmod 600 "$HOME/.config/copr"
          copr-cli whoami >/dev/null

      - name: Ensure COPR project and chroots
        if: steps.srpm.outcome == 'success'
        run: copr/setup-project.sh "$COPR_PROJECT"

      - name: Submit COPR build
        if: steps.srpm.outcome == 'success'
        id: submit
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r plasma_version chroots srpm; do
            [[ -n "$srpm" && "$srpm" != "-" ]] || continue
            args=()
            IFS=',' read -r -a group <<< "$chroots"
            for chroot in "${group[@]}"; do
              args+=(-r "$chroot")
            done
            echo "Submitting ${srpm} for Plasma ${plasma_version}..." >&2
            copr-cli build "${args[@]}" "$COPR_PROJECT" "$srpm"
          done < "$PWD/out/matrix.tsv"

      # Commit only after COPR accepted the build (or when no rebuild was
      # needed). If a build fails, the next scheduled run retries it.
      - name: Commit updated packaging metadata
        if: always() && steps.sync.outputs.changed == 'true' && (steps.srpm.outcome == 'skipped' || steps.submit.outcome == 'success')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plasma-ions-china.spec packaging/state.json
          git commit -m "chore: sync packaging (${{ steps.sync.outputs.summary }}) [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }
